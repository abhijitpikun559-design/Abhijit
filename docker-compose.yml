version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: edugen_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-edugen_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edugen_password}
      POSTGRES_DB: ${DB_NAME:-edugen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edugen_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edugen_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edugen_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-edugen_user}:${DB_PASSWORD:-edugen_password}@postgres:5432/${DB_NAME:-edugen_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edugen_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edugen_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - edugen_network
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:

networks:
  edugen_network:
    driver: bridge
